name: agent-prediction-remote

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Remote agent prediction task id
        required: true
        type: string
      race_id:
        description: netkeiba race id
        required: true
        type: string
      race_url:
        description: netkeiba shutuba URL
        required: true
        type: string
      scope_key:
        description: prediction scope key
        required: false
        type: string
      scoring_profile:
        description: keiba_llm_agent scoring profile
        required: false
        type: string
      callback_url:
        description: Render callback URL
        required: true
        type: string

jobs:
  agent_prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_PREDICTION_TIMEOUT_MINUTES: "45"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent prediction
        id: run_agent
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_TIMEOUT_SECONDS: "180"
          KEIBA_LLM_PROVIDER: gemini
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s "${AGENT_PREDICTION_TIMEOUT_MINUTES}m" \
            python keiba_llm_agent/main.py predict-race \
            --url "${{ inputs.race_url }}" \
            --force-refresh \
            --skip-report \
            --skip-social \
            --llm-provider gemini \
            --scoring-profile "${{ inputs.scoring_profile || 'accuracy_default' }}" \
            2>&1 | tee agent_prediction_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "agent prediction command timed out after ${AGENT_PREDICTION_TIMEOUT_MINUTES} minutes (exit_code=${status})" | tee -a agent_prediction_output.log
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build callback payload
        shell: bash
        env:
          RUN_EXIT_CODE: ${{ steps.run_agent.outputs.exit_code }}
          RACE_ID: ${{ inputs.race_id }}
          AGENT_PREDICTION_TIMEOUT_MINUTES: ${{ env.AGENT_PREDICTION_TIMEOUT_MINUTES }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          race_id = re.sub(r"\D", "", os.environ.get("RACE_ID", ""))
          exit_code = int(str(os.environ.get("RUN_EXIT_CODE", "1") or "1"))
          log_path = Path("agent_prediction_output.log")
          prediction_path = Path("keiba_llm_agent/data/predictions") / f"{race_id}.json"
          audit_path = Path("keiba_llm_agent/data/backtest_audit") / f"{race_id}.json.gz"

          log_excerpt = ""
          if log_path.exists():
              log_excerpt = log_path.read_text(encoding="utf-8", errors="replace")[-8000:]

          summary = {
              "race_id": race_id,
              "prediction_path": str(prediction_path),
              "backtest_audit_path": str(audit_path),
              "exit_code": exit_code,
          }

          if exit_code == 0 and prediction_path.exists():
              result = {
                  "filename": prediction_path.name,
                  "content_base64": base64.b64encode(prediction_path.read_bytes()).decode("ascii"),
              }
              if audit_path.exists():
                  result["audit_filename"] = audit_path.name
                  result["audit_content_base64"] = base64.b64encode(audit_path.read_bytes()).decode("ascii")
              payload = {
                  "status": "succeeded",
                  "summary": summary,
                  "result": result,
                  "log_excerpt": log_excerpt,
              }
          else:
              if exit_code in (124, 137, 143):
                  timeout_minutes = os.environ.get("AGENT_PREDICTION_TIMEOUT_MINUTES", "45")
                  error_message = f"agent prediction timed out after {timeout_minutes} minutes"
              else:
                  error_message = f"agent prediction failed with exit_code={exit_code}"
              if not prediction_path.exists():
                  error_message += f" prediction_missing={prediction_path}"
              payload = {
                  "status": "failed",
                  "summary": summary,
                  "error_message": error_message,
                  "log_excerpt": log_excerpt,
              }

          Path("callback_payload.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Post callback
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          PIPELINE_CALLBACK_SECRET: ${{ secrets.PIPELINE_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import os
          import time
          import urllib.request
          from pathlib import Path

          payload_bytes = Path("callback_payload.json").read_bytes()
          secret = os.environ.get("PIPELINE_CALLBACK_SECRET", "").encode("utf-8")
          sig = "sha256=" + hmac.new(secret, payload_bytes, hashlib.sha256).hexdigest()
          delays = (0, 5, 15)
          last_error = None
          for attempt, delay in enumerate(delays, start=1):
              if delay:
                  time.sleep(delay)
              req = urllib.request.Request(
                  os.environ["CALLBACK_URL"],
                  data=payload_bytes,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "X-Hub-Signature-256": sig,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      print(resp.read().decode("utf-8", errors="replace"))
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"callback attempt {attempt}/{len(delays)} failed: {exc}", flush=True)
          else:
              raise RuntimeError(f"callback failed after {len(delays)} attempts: {last_error}")
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-prediction-diagnostics-${{ inputs.task_id }}
          if-no-files-found: warn
          path: |
            callback_payload.json
            agent_prediction_output.log
            keiba_llm_agent/data/predictions/${{ inputs.race_id }}.json
            keiba_llm_agent/data/backtest_audit/${{ inputs.race_id }}.json.gz

      - name: Fail workflow on remote failure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("callback_payload.json").read_text(encoding="utf-8"))
          if str(payload.get("status", "")).lower() == "succeeded":
              sys.exit(0)
          print(payload.get("error_message", "agent prediction failed"))
          print(payload.get("log_excerpt", "")[-4000:])
          sys.exit(1)
          PY
