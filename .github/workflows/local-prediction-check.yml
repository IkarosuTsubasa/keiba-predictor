name: 地方予測の動作確認

on:
  workflow_dispatch:
    inputs:
      date:
        description: 確認する日付（YYYY-MM-DD、省略時は日本の当日）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: local-prediction-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 地方予測と保存処理の確認
        run: python -m unittest tests.test_local_pipeline_isolation tests.test_agent_prediction_stages tests.test_agent_predictions_scope tests.test_race_discovery tests.test_public_workout_capture tests.test_workout_shadow -v
      - name: 地方出馬表と過去成績の取得確認
        env:
          CHECK_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$CHECK_DATE" ]; then
            python pipeline/check_local_acquisition.py --date "$CHECK_DATE" --output local-check/result.json
          else
            python pipeline/check_local_acquisition.py --output local-check/result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-prediction-check
          path: local-check/
          if-no-files-found: warn
